name: ROS 2 Nav2 runtime

on:
  push:
    paths:
      - 'reference/ros2-enforcer/**'
      - 'reference/admission/**'
      - 'tests/ros2/**'
      - '.github/workflows/ros2-nav2.yml'
  pull_request:
    paths:
      - 'reference/ros2-enforcer/**'
      - 'reference/admission/**'
      - 'tests/ros2/**'
      - '.github/workflows/ros2-nav2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-ros-pubsub:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 15
    env:
      ROS_LOCALHOST_ONLY: '1'
      SPP_REQUIRE_ROS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install binary runtime and test dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ros-humble-nav2-msgs ros-humble-nav2-controller ros-humble-nav2-regulated-pure-pursuit-controller build-essential cmake python3-pytest python3-yaml python3-pip
          python3 -m pip install 'jsonschema>=4.23,<5'
      - name: Build test-only controller observation plugin (not Nav2)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cmake -S tests/ros2/plugins -B /tmp/spp-boundary-build -DCMAKE_INSTALL_PREFIX=/tmp/spp-boundary-install
          cmake --build /tmp/spp-boundary-build -j2
          cmake --install /tmp/spp-boundary-build
      - name: Test ROS publication, ControllerServer boundary and live command speed
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source /tmp/spp-boundary-install/share/spp_boundary_observer/local_setup.bash
          python3 -m pytest -v -s tests/ros2/test_nav2_runtime.py tests/ros2/test_nav2_controller_boundary.py tests/ros2/test_nav2_motion_limit.py
