services:
  spp-reference-sandbox:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
