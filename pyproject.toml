[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-policy-protocol"
version = "0.1.0"
description = "PlaceAuth reference implementation of Spatial Policy Protocol 0.1"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
spp-evaluate = "spp.evaluator:main"
spp-server = "spp.server:main"

[tool.setuptools]
packages = ["spp", "spp_admission"]
package-dir = { "spp" = "reference/policy-server/src/spp", "spp_admission" = "reference/admission/src/spp_admission" }

[tool.pytest.ini_options]
testpaths = ["tests"]
