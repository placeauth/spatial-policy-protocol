[package]
name = "spp-jcs-rust-verifier"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental independent Rust verifier for SPP RFC 8785 admission-trust vectors"

[dependencies]
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
